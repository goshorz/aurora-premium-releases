name: Publish Aurora Premium 1.1.0 official APK
on:
  push:
    paths: ['.github/workflows/publish-aurora-110.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download signed Aurora Premium 1.1.0 artifact
        env:
          DOWNLOAD_SOURCE: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-17a8-81f4-845a-e2458aa7cc9f/raw?se=2026-10-25T21%3A25%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=4bfd0405-776e-56b5-8e90-b5a5ee79f1c4&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-25T06%3A12%3A32Z&ske=2026-10-26T06%3A12%3A32Z&sks=b&skv=2026-02-06&sig=VRCuqow0bHNxWawZFcdYh59z6bmcnTXkAKUGWa6QPf4%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$DOWNLOAD_SOURCE" --output /tmp/aurora-110-signed.zip
          test "$(stat -c '%s' /tmp/aurora-110-signed.zip)" -gt 1000000
          unzip -j /tmp/aurora-110-signed.zip Aurora-Premium-1.1.0-Glow-SIGNED.apk -d /tmp/
          unzip -j /tmp/aurora-110-signed.zip Aurora-Premium-1.1.0-package.txt -d /tmp/
          unzip -j /tmp/aurora-110-signed.zip Aurora-Premium-1.1.0-signing-info.txt -d /tmp/
      - name: Authenticate the exact verified signed APK and package identity
        run: |
          set -euo pipefail
          echo "48a33a4fa85f39a41d1e4bbcd3470974ef2433476a300cb1227d21fb67691015  /tmp/Aurora-Premium-1.1.0-Glow-SIGNED.apk" | sha256sum --check --status
          grep -q "name='bg.razgrad.aurorapremium'" /tmp/Aurora-Premium-1.1.0-package.txt
          grep -q "versionCode='66'" /tmp/Aurora-Premium-1.1.0-package.txt
          grep -q "versionName='1.1.0'" /tmp/Aurora-Premium-1.1.0-package.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/Aurora-Premium-1.1.0-signing-info.txt
      - name: Publish APK as direct release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.0-official /tmp/Aurora-Premium-1.1.0-Glow-SIGNED.apk#Aurora-Premium-1.1.0-Glow-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Aurora Premium 1.1.0 — Official Android TV Release" \
            --notes "Официална подписана Aurora Premium 1.1.0 за Rocktek G2 и Android TV. 4 запазени оригинални стила метеорологични икони с независими анимации; въртящи се слънчеви лъчи; отделно управление на дъжд и сняг около часовника; елегантна Soft Cyan икона пред Разград; нов Aurora Premium TV банер без Preview C; корекция на повтарящия се диалог за изтеглен APK; запазени Smart Forecast, Foreca, празнични ефекти и настройки. VersionCode 66. SHA-256: 48a33a4fa85f39a41d1e4bbcd3470974ef2433476a300cb1227d21fb67691015."
