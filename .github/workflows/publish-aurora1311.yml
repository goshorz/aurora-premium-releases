name: Publish Aurora Premium 1.3.11 — LED Weather Icons Ultra Refresh
on:
  push:
    branches: [main]
    paths: ['incoming/aurora1311/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora1311-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.11-Official-SIGNED.apk'
          DIR='incoming/aurora1311'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 143 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.11-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora1311-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora1311-package.txt
          grep -q "versionCode='143'" aurora1311-package.txt
          grep -q "versionName='1.3.11'" aurora1311-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora1311-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora1311-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 143, 1.3.11, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.11-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.11'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.11-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.11 — LED Weather Icons Ultra Refresh' \
            --notes 'Aurora Premium 1.3.11 (versionCode 143) — LED Weather Icons Ultra Refresh за Digital Premium. Преработени плавните SVG LED силуети: луна с истински остри върхове и фин вътрешен светлинен слой; по-симетрично слънце; облак, частична облачност ден/нощ, светкавица и мъгла с по-четими LED форми. Дъждът остава точно с девет анимирани капки в три реда, снегът — с три самостоятелно анимирани снежинки от по пет точки. Осемте досегашни цвята и синхронизацията с иконата остават, заедно с Original LED, Satin Light и Crystal Depth. Няма промени във Flip Clock, подредбата, Smart Forecast, OLED защитата, празничните изображения, Foreca и температурата от Weather Underground с резервен WeatherCloud. Оригинален сертификат и директна OTA актуализация над 1.3.10 със запазени настройки.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
