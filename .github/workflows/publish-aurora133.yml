name: Publish Aurora Premium 1.3.3 official signed APK from immutable source
on:
  push:
    branches: [main]
    paths:
      - 'incoming/aurora133/ready.txt'
permissions:
  contents: write
concurrency:
  group: aurora-133-official-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable signed APK and verify SHA256
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME='Aurora-Premium-1.3.3-Foreca-SIGNED.apk'
          SRC='https://raw.githubusercontent.com/goshorz/Aurora-Preview/a1ac5bbd89f9dc61015a6fa4882c9309a8d4f7ec/published/'
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "${SRC}${NAME}" -o "dist/${NAME}"
          echo 'da7524a9f783dca23bf8d9d1712830560c8075af0e0644de359d225c6aa1340b  dist/Aurora-Premium-1.3.3-Foreca-SIGNED.apk' | sha256sum --check
          test "$(stat -c %s "dist/${NAME}")" -ge 1800000
          test "$(stat -c %s "dist/${NAME}")" -le 8000000
      - name: Verify Android identity, original certificate, and alignment
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.3-Foreca-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee aurora133-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora133-package.txt
          grep -q "versionCode='135'" aurora133-package.txt
          grep -q "versionName='1.3.3'" aurora133-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora133-certificate.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora133-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Publish verified official APK once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.3-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $TAG"; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.3-Foreca-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.3 — Foreca Forecast & Nowcast' \
            --notes 'Официална Aurora Premium 1.3.3 (versionCode 135). Почасовата прогноза, Smart Forecast и радарната прогноза за дъжд (до 60 минути, когато Foreca предоставя резолюция 1 минута) използват Foreca вместо Google Weather. 15-минутна прогноза до 3 часа, проверена за Разград; метеорологичните условия се получават от Foreca. Температурата продължава да идва приоритетно от личната метеостанция чрез Weather Underground / WeatherCloud. Запазени LED и Flip часовниците, всички стилове, OLED защита, празници, позиции и настройки. Не е включена услуга за официални предупреждения на НИМХ. Подписан с оригиналния сертификат на Aurora Premium 1.3.2.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
