name: Publish Aurora Premium 1.3.5 official signed LED weather
on:
  push:
    branches: [main]
    paths:
      - 'incoming/aurora135/ready.txt'
permissions:
  contents: write
concurrency:
  group: aurora-135-official-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble immutable signed APK from verified source chunks
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.5-LED-Rain-Snow-SIGNED.apk'
          mkdir -p dist
          test "$(find incoming/aurora135 -name 'part-*' | wc -l)" -ge 20
          cat incoming/aurora135/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat incoming/aurora135/sha256.txt)"
          printf '%s  %s\n' "$expected" "dist/$NAME" | sha256sum --check
          test "$(stat -c %s "dist/$NAME")" -ge 1800000
          test "$(stat -c %s "dist/$NAME")" -le 8000000
      - name: Verify package identity, version, original signing certificate and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.5-LED-Rain-Snow-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee aurora135-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora135-package.txt
          grep -q "versionCode='137'" aurora135-package.txt
          grep -q "versionName='1.3.5'" aurora135-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora135-certificate.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora135-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Publish once and do not overwrite existing official release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.3.5-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Official tag already exists; refusing to overwrite"; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.5-LED-Rain-Snow-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.5 — Digital LED Rain & Snow' \
            --notes 'Официална Aurora Premium 1.3.5 (versionCode 137). Digital Premium: видимо падащи последователни LED капки и три независимо движещи се снежинки с плавно отклонение. Запазени Pearl Ice White + Satin Light, LED Glow, Flip Premium, OLED Smart Protection, Smart Forecast 4.0, Foreca прогнози, празници, анимационни настройки и позиции. Температурата остава от личната станция IRAZGR17 чрез Weather Underground с автоматичен резервен WeatherCloud при недостъпност. Подписан APK със същия оригинален сертификат, инсталира се върху 1.3.4 без загуба на настройки.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
