name: Publish Aurora Premium 1.3.8 — official signed classic holiday restoration
on:
  push:
    branches: [main]
    paths: ['incoming/aurora138/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora138-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.8-Official-SIGNED.apk'
          DIR='incoming/aurora138'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 140 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.8-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora138-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora138-package.txt
          grep -q "versionCode='140'" aurora138-package.txt
          grep -q "versionName='1.3.8'" aurora138-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora138-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora138-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 140, 1.3.8, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.8-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.8'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.8-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.8 — Classic Holiday Artwork Restored' \
            --notes 'Aurora Premium 1.3.8 (versionCode 140) възстановява оригиналните фини SVG празнични украси от 1.3.5 вместо големите изображения в 1.3.6/1.3.7. Поправено показване от 27 до 30 декември: вече винаги се виждат малките коледни клонки и Весели празници! Запазени са специалните поздрави за 31 декември и 1 януари, с фини новогодишни фойерверки. Няма промени в LED дъжд, сняг, Flip, Digital, Smart Forecast 4.1, Foreca, Weather Underground и резервния WeatherCloud. Подписана с оригиналния сертификат за директна OTA актуализация върху 1.3.7 без загуба на настройки.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
