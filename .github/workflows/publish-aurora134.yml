name: Publish Aurora Premium 1.3.4 official signed APK from immutable source
on:
  push:
    branches: [main]
    paths:
      - 'incoming/aurora134/ready.txt'
permissions:
  contents: write
concurrency:
  group: aurora-133-official-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable signed APK and verify SHA256
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME='Aurora-Premium-1.3.4-SmartForecast-SIGNED.apk'
          # Source repository is private; the immutable, SHA-matched APK is staged
          # as a Git blob in this repository by the authorized connector.
          test "$(find incoming/aurora134 -name 'part-*' | wc -l)" -ge 20
          cat incoming/aurora134/part-* | base64 --decode > "dist/${NAME}"
          echo '9c87bbb9a8eef6ae0f6c6ac772fc4b1967935a0e31e9341b1e95a46960303dba  dist/Aurora-Premium-1.3.4-SmartForecast-SIGNED.apk' | sha256sum --check
          test "$(stat -c %s "dist/${NAME}")" -ge 1800000
          test "$(stat -c %s "dist/${NAME}")" -le 8000000
      - name: Verify Android identity, original certificate, and alignment
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.4-SmartForecast-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee aurora134-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora134-package.txt
          grep -q "versionCode='136'" aurora134-package.txt
          grep -q "versionName='1.3.4'" aurora134-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora134-certificate.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora134-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Publish verified official APK once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.4-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing $TAG"; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.4-SmartForecast-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.4 — Smart Forecast 4.0' \
            --notes 'Официална Aurora Premium 1.3.4 (versionCode 136). Smart Forecast 4.0: различава измерен дъжд в момента, предстоящ дъжд и прогнозирано отслабване при потвърждение от метеостанцията и реална 1-минутна радарна прогноза от Foreca. Силните гръмотевични явления запазват приоритет. Без нови заявки към Google Weather. Температурата остава с приоритет личната метеостанция чрез Weather Underground / WeatherCloud. Напълно запазени LED и Flip часовници, Pearl Ice White, Satin Light, LED Glow, OLED Smart Protection, Pixel Shift, празничните ефекти, настройки и позиции. Подписана с оригиналния сертификат.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
