name: Publish Aurora Premium 1.3.46 — Balanced Festive LED Garland
on:
  push:
    branches: [main]
    paths: ['incoming/aurora1346/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora1346-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.46-Official-SIGNED.apk'
          DIR='incoming/aurora1346'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(cat "$DIR/source-commit.txt")" = '1a5f542d8ce280af34307e071f4d219ba10adc56'
          test "$(cat "$DIR/sha256.txt")" = 'c3f347fa95d53ff44b7bd9dce4da2804235bc3ce5cfa295383e8d221d4ce459c'
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -eq 2327021
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 178 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.46-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora1346-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora1346-package.txt
          grep -q "versionCode='178'" aurora1346-package.txt
          grep -q "versionName='1.3.46'" aurora1346-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora1346-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora1346-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 178, 1.3.46, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.46-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.46'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.46-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.46 — Balanced Festive LED Garland' \
            --notes 'Aurora Premium 1.3.46 (versionCode 178): официално одобрени празнични изображения за шест периода 1–15, 16–23, 24–26, 27–30, 31 декември и 1 януари. Компактни празнични надписи и иконки с обновен Дядо Коледа, който плавно помахва с ясно видима ръка. Зелени клонки зад иконите са премахнати. Надписът за 1–15 декември е „Празнично настроение!“. Гирляндът е с по-гъсто подредени лампички и балансирано меко светене; цветовете и анимациите са деликатни. Aurora Signature, Flip Premium, Digital Premium, Foreca, Weather Underground, Smart Forecast, OLED защитата и всички настройки са запазени. Официален APK с оригинален сертификат, обновяване без деинсталиране.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
