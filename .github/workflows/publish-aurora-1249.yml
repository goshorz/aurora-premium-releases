name: Publish Aurora Premium 1.2.49 combined upgrade
on:
  push:
    branches: [main]
    paths:
      - 'apk/Aurora-Premium-1.2.49-SmartForecastFlipDiagnostics-SIGNED.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published binary
        uses: actions/checkout@v4
      - name: Verify source file and create public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=apk/Aurora-Premium-1.2.49-SmartForecastFlipDiagnostics-SIGNED.apk
          TAG=v1.2.49-official
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite the signed public APK"
            exit 0
          fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aurora Premium 1.2.49 — Smart Forecast 2.1, Flip Pro & Diagnostics" \
            --notes "Една обща подписана актуализация: Smart Forecast 2.1 с достъпно в официалната версия тестово меню за всички предупреждения и бутон за връщане към автоматичната прогноза; Weather Diagnostics с ръчна проверка на метеостанцията и Google Weather; Flip Clock Pro с фини отражения и сенки. Останалите оформления, измерванията, празничните ефекти и Pixel Shift са запазени. VersionCode 130; инсталира се върху наличната Aurora Premium без загуба на настройки."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,tagName,url
