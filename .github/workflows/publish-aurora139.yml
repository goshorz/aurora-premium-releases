name: Publish Aurora Premium 1.3.9 — unified LED colors and repaired holiday art
on:
  push:
    branches: [main]
    paths: ['incoming/aurora139/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora139-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.9-Official-SIGNED.apk'
          DIR='incoming/aurora139'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 141 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.9-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora139-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora139-package.txt
          grep -q "versionCode='141'" aurora139-package.txt
          grep -q "versionName='1.3.9'" aurora139-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora139-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora139-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 141, 1.3.9, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.9-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.9'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.9-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.9 — New Premium LED Colors & Fixes' \
            --notes 'Официална Aurora Premium 1.3.9 (versionCode 141) с осем избираеми цвята за Digital Premium: всички шест досегашни плюс Champagne Gold (#F3D9AC) и Rose Platinum (#DFB9C0). При Pearl Ice White, Champagne Gold и Rose Platinum часовникът, датата, температурата (°C) и стрелката на тенденцията светят в еднакъв нюанс със Satin Light; метеорологичните икони и LED дъжд/сняг остават независими. Запазени са възстановените 9 LED дъждовни капки (три реда), оригиналната нежна коледна украса от 1.3.5 и работещите дни 27–30 декември, отделните поздрави на 31 декември и 1 януари. Без промени в Flip, OLED Smart Protection, Smart Forecast 4.1, прогнозите Foreca и температурата Weather Underground (резервен WeatherCloud). Оригинален производствен подпис и директна OTA актуализация върху 1.3.8 със запазени настройки.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
