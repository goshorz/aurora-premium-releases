name: Publish Aurora Premium 1.3.39 — Six Embedded Holiday Greetings
on:
  push:
    branches: [main]
    paths: ['incoming/aurora1339/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora1339-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.39-Official-SIGNED.apk'
          DIR='incoming/aurora1339'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(cat "$DIR/source-commit.txt")" = '2ad2281c893a94cfac0fe93b0f1d93bcd79a5775'
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 171 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.39-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora1339-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora1339-package.txt
          grep -q "versionCode='171'" aurora1339-package.txt
          grep -q "versionName='1.3.39'" aurora1339-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora1339-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora1339-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 171, 1.3.39, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.39-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.39'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.39-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.39 — Six Embedded Holiday Greetings' \
            --notes 'Aurora Premium 1.3.39 (versionCode 171): шест индивидуални прозрачни празнични изображения с вградени надписи за 1–15, 16–23, 24–26, 27–30 и 31 декември и 1 януари. Без допълнителни дублиращи поздрави. Компактно разположение горе вдясно, по-отчетлив Дядо Коледа, нежни анимации и работещ тестов преглед. Aurora Signature остава стилът по подразбиране; метеофункциите са запазени. Подписан с оригиналния сертификат APK, обновяване без деинсталиране.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
