name: Publish Aurora Premium 1.2.14 signed APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aurora-1214.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed Aurora 1.2.14 APK
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-9cb8-8211-b810-df35a88c65b5/raw?se=2026-10-28T19%3A51%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=9da89351-f8ef-5811-bbb4-91224746e442&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-28T05%3A33%3A43Z&ske=2026-10-29T05%3A33%3A43Z&sks=b&skv=2026-02-06&sig=QcID%2Bgnvs6fF2d3H29jN36QhUpBfzuNbSDZf5c8FTAs%3D' --output aurora-signed-artifact.zip
          unzip -j aurora-signed-artifact.zip 'Aurora-Premium-1.2.14-ManualPosition-SIGNED.apk'
          printf '%s  %s\n' '2d50f2eedc63a97dde72f08ba75e585247b7458d331d8d2a901423ff80b7d22a' 'Aurora-Premium-1.2.14-ManualPosition-SIGNED.apk' | sha256sum --check
          test "$(stat -c '%s' 'Aurora-Premium-1.2.14-ManualPosition-SIGNED.apk')" = 2185352
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > NOTES.md <<'NOTES'
          Aurora Premium 1.2.14 — официална стабилна версия за Android TV.

          Ново: ръчно преместване на целия часовник от меню „Позиция на часовника“.
          - Управление нагоре, надолу, наляво и надясно с дистанционното на Android TV.
          - Нормална стъпка 5 dp и фина стъпка 1 dp.
          - Бутон за връщане в стандартната позиция.
          - Новата позиция се запазва след рестартиране и не пречи на Pixel Shift.

          Запазени са Smart Forecast под часовника, предупрежденията за наближаващ дъжд,
          анимираните Outline икони, почасовата прогноза и досегашното оформление.

          Инсталирайте APK като актуализация върху Aurora Premium 1.2.13 или по-стара версия
          без деинсталиране, за да запазите настройките.
          NOTES
          if gh release view v1.2.14-official --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.2.14-official 'Aurora-Premium-1.2.14-ManualPosition-SIGNED.apk' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.2.14-official 'Aurora-Premium-1.2.14-ManualPosition-SIGNED.apk' --title 'Aurora Premium 1.2.14 — Stable' --notes-file NOTES.md --target main --latest --repo "$GITHUB_REPOSITORY"
          fi
