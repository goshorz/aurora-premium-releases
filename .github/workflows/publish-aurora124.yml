name: Publish Aurora Premium 1.2.4 signed release
on:
  push:
    paths:
      - '.github/workflows/publish-aurora124.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_SOURCE: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-8224-820a-8af0-6e92960a3a85/raw?se=2026-10-27T20%3A54%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=2e34fb38-cd71-5b9c-b562-67b30e2af320&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A06%3A48Z&ske=2026-10-28T12%3A06%3A48Z&sks=b&skv=2026-02-06&sig=JQhlq9wHjQ49vraDp97OJcQFKilJXKor/vOMhAZITUE%3D'
      APK_NAME: 'Aurora-Premium-1.2.4-CleanMaps-SIGNED.apk'
      EXPECTED_SHA256: 'c32170a555bb8a91b5e3a0155973d7c563f14d3438b591496c6a7c03fe65a2c7'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified signed build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$ARTIFACT_SOURCE" -o signed-artifact.zip
          unzip -j signed-artifact.zip "$APK_NAME"
          echo "$EXPECTED_SHA256  $APK_NAME" | sha256sum --check --strict
      - name: Publish signed APK to official GitHub Releases
        run: |
          set -euo pipefail
          gh release create v1.2.4-clean-maps "$APK_NAME" \
            --repo goshorz/aurora-premium-releases \
            --target main \
            --title "Aurora Premium 1.2.4 — Clean Google Maps Logo" \
            --notes "Official signed Android TV update. Corrected Google Maps logo placement beneath the weather icon without covering the date; official outlined attribution artwork; small readable Google weather-data credit. Google Weather, VEVOR temperature, Smart Forecast, icons, animations and settings retained. Version code: 85." \
            --latest
      - name: Verify downloadable release asset
        run: |
          set -euo pipefail
          gh release view v1.2.4-clean-maps --repo goshorz/aurora-premium-releases --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
