name: Publish Aurora Premium 1.2.27 official signed APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aurora-1227.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve exact signed 1.2.27 artifact and validate SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE='Aurora-Premium-1.2.27-FlipChristmas-SIGNED.apk'
          if ! gh run download 40952842511 -R goshorz/Aurora-Preview -n Aurora-Premium-1.2.27-FlipChristmas-SIGNED -D .; then
            echo 'Cross-repository artifact download unavailable, using verified temporary artifact mirror'
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 160 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-bf88-820a-9ac3-2f552c6069ed/raw?se=2026-10-29T21%3A04%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=015b8458-79a4-5993-957d-65e30ab7cbdd&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T19%3A08%3A54Z&ske=2026-10-30T19%3A08%3A54Z&sks=b&skv=2026-02-06&sig=6RUy56przWJr%2BxB%2B7%2BBNZP4XVxcEvc3UZH5zYvQbFao%3D' --output signed-artifact.zip
            unzip -jo signed-artifact.zip "$FILE"
          fi
          test -s "$FILE"
          printf '%s  %s\n' '2376ff5d077bbb7daaa319e254dc4bdf94cfc36c5d2963dced0f354c09d65938' "$FILE" | sha256sum --check
          test "$(stat -c '%s' "$FILE")" = 2202557
      - name: Publish verified signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > NOTES.md <<'NOTES'
          Aurora Premium 1.2.27 — официална актуализация за Android TV (Flip Christmas Edition).

          - Коледна украса специално за прозрачния Flip Premium часовник — зелени клонки, топло-бели светещи лампички и фини червено-златни акценти.
          - Elegant Garland (16–23 декември) и Premium Garland със златна звезда (24–26 декември).
          - Автоматично показване по дата или ръчен избор за незабавен тест: Auto, Off, Elegant, Premium.
          - Плавно сияние без агресивно мигане; спазва празничните настройки, режима Cinema и настройките за намалени анимации.
          - Запазени са Flip анимацията, едноредовата дата, прозрачността, Smart Forecast, Pixel Shift и разширеното преместване вдясно от 1.2.26.

          Официално подписан APK с оригиналния сертификат на Aurora Premium. Инсталирайте като актуализация върху 1.2.26 или предходни версии, без деинсталиране.
          NOTES
          if gh release view v1.2.27-official --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.2.27-official 'Aurora-Premium-1.2.27-FlipChristmas-SIGNED.apk' --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.2.27-official --repo "$GITHUB_REPOSITORY" --latest --title 'Aurora Premium 1.2.27 — Flip Christmas Edition' --notes-file NOTES.md
          else
            gh release create v1.2.27-official 'Aurora-Premium-1.2.27-FlipChristmas-SIGNED.apk' --title 'Aurora Premium 1.2.27 — Flip Christmas Edition' --notes-file NOTES.md --target main --latest --repo "$GITHUB_REPOSITORY"
          fi
