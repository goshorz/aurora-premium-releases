name: Publish Aurora Premium 1.3.38 — Distinct Holiday Ornaments and 31 Dec Fix
on:
  push:
    branches: [main]
    paths: ['incoming/aurora1338/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora1338-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.38-Official-SIGNED.apk'
          DIR='incoming/aurora1338'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 170 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.38-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora1338-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora1338-package.txt
          grep -q "versionCode='170'" aurora1338-package.txt
          grep -q "versionName='1.3.38'" aurora1338-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora1338-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora1338-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 170, 1.3.38, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.38-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.38'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.38-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.38 — Distinct Holiday Ornaments and 31 Dec Fix' \
            --notes 'Aurora Premium 1.3.38 (versionCode 170): преработени са пет различни, компактни, кристално ясни векторни декорации за 1–15, 16–23, 27–30 и 31 декември и 1 януари. Запазен е одобреният Дядо Коледа за 24–26 декември. Поправена е конкретната грешка, която блокира избора на празничен тест за 31 декември — newyear_eve е добавен към разрешените режими. Надписът за 31.12 е разположен на два реда, без отрязване, с фини анимации и възможност за изключване. Одобреният Aurora Signature остава по подразбиране; Horizon и Atelier остават премахнати. Всички метеофункции и останалите стилове са запазени. Оригинално подписан APK, инсталиране без деинсталиране.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
