name: Publish Aurora Premium 1.2.17 stable signed APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aurora-1217.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and cryptographically verify signed 1.2.17 APK
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-65c0-81f4-ba52-dcd853918d8c/raw?se=2026-10-29T12%3A52%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=02267ea2-69a4-5188-aa7c-262e75270bc6&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T04%3A10%3A18Z&ske=2026-10-30T04%3A10%3A18Z&sks=b&skv=2026-02-06&sig=Nxh2XZmhtajsJ01wNZuXZ8gV/nKnm/vWTzjRm3HJ3ik%3D' --output signed-artifact.zip
          unzip -j signed-artifact.zip 'Aurora-Premium-1.2.17-DateLift8px-SIGNED.apk'
          printf '%s  %s\n' '2ddef803d66e4ece282520aa0389dd4fe4021120122e3c82dbbd2a7b715fc24e' 'Aurora-Premium-1.2.17-DateLift8px-SIGNED.apk' | sha256sum --check
          test "$(stat -c '%s' 'Aurora-Premium-1.2.17-DateLift8px-SIGNED.apk')" = 2186347
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > NOTES.md <<'NOTES'
          Aurora Premium 1.2.17 — официално стабилно издание за Android TV.

          - Включване и изключване на името „Разград“ и иконата за местоположение.
          - При скрито местоположение ненужната празнина под температурата се премахва автоматично; датата се повдига с още 8 px (4 px при почасова прогноза).
          - Ръчно преместване на целия часовник с дистанционно; фина стъпка 1 dp, обикновена 5 dp, запазена позиция след рестарт.
          - Smart Forecast предупреждения под часовника, анимирани Outline икони, почасова прогноза под температурата.
          - Запазени настройки, Pixel Shift и данните за времето.

          Инсталирайте като актуализация върху наличната Aurora Premium без деинсталиране.
          NOTES
          if gh release view v1.2.17-official --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.2.17-official 'Aurora-Premium-1.2.17-DateLift8px-SIGNED.apk' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.2.17-official 'Aurora-Premium-1.2.17-DateLift8px-SIGNED.apk' --title 'Aurora Premium 1.2.17 — Stable' --notes-file NOTES.md --target main --latest --repo "$GITHUB_REPOSITORY"
          fi
