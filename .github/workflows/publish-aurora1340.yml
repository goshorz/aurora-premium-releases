name: Publish Aurora Premium 1.3.40 — Compact Classic Festive Strips
on:
  push:
    branches: [main]
    paths: ['incoming/aurora1340/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora1340-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.40-Official-SIGNED.apk'
          DIR='incoming/aurora1340'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(cat "$DIR/source-commit.txt")" = 'dcad30a4848e1ae9201c779bf682a90b6348261e'
          test "$(cat "$DIR/sha256.txt")" = '4fa53835a968b3ab4e0303f3428f47bbbe6cfcbecda1c22f22cd36b740745e2f'
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 172 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.40-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora1340-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora1340-package.txt
          grep -q "versionCode='172'" aurora1340-package.txt
          grep -q "versionName='1.3.40'" aurora1340-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora1340-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora1340-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 172, 1.3.40, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.40-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.40'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.40-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.40 — Compact Classic Festive Strips' \
            --notes 'Aurora Premium 1.3.40 (versionCode 172): старите компактни празнични изображения за шест периода се връщат с намален шрифт, деликатни анимации и вградени поздрави без дублиране. Височината на празничния ред е 62 вместо 90, разположението е горе вдясно. Aurora Signature и всички метеофункции са запазени. Подписан APK с оригиналния сертификат.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
