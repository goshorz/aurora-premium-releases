name: Publish Aurora Premium 1.0.7 official
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurora-107.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  official-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download prebuilt production-signed APK
        env:
          ARCHIVE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-1438-81f4-b35c-7d52e12c87ad/raw?se=2026-10-24T17%3A38%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=1afcd2b5-6f27-5cf3-8d1a-c85493761a86&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-24T07%3A13%3A42Z&ske=2026-10-25T07%3A13%3A42Z&sks=b&skv=2026-02-06&sig=BS6ew3QaVzPoZtdZ3UVpK7xVk2wu/RTzSm4Rz0iyQ58%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 150 "$ARCHIVE_URL" -o release-artifact.zip
          unzip -tq release-artifact.zip
          unzip -p release-artifact.zip app/build/outputs/apk/release/app-release.apk > app-release.apk
          test -s app-release.apk
          printf '%s  app-release.apk\n' '887df43c88c632b5d8f38ccc0068316a0cf512346343aa7c844dc6c67048df73' | sha256sum -c -
      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Aurora Premium 1.0.7 — официално издание
          
          - **Foreca Nowcast**: кратки предупреждения за значителен предстоящ дъжд, сняг и смесени валежи (до около 2 часа), само при достатъчно надеждни данни. Няма Open-Meteo или измислени предупреждения.
          - **Aurora Radar Premium** до Разград, без цветната точка за опресняване.
          - **Дата:** избор между осем дизайна; Smart Forecast се показва под датата.
          - **Празнична визия:** компактна украса горе вдясно, поправен български трибагреник, оригинални празнични изображения и специална украса за 1 май.
          - **Pixel Shift:** независимо, фино преместване на часовника и празничната лента за OLED.
          - Запазени са използваните метеорологични източници, съществуващите настройки и съвместимостта с Rocktek G2.
          
          APK е подписан с официалния сертификат на Aurora Premium и надгражда версия 1.0.6, без деинсталация.
          
          **SHA-256:** \`887df43c88c632b5d8f38ccc0068316a0cf512346343aa7c844dc6c67048df73\`
          EOF
      - name: Create public official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.7-official --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists; abort to avoid overwriting a published APK" >&2
            exit 1
          fi
          gh release create v1.0.7-official "app-release.apk#Aurora Premium 1.0.7 — подписан APK" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Aurora Premium 1.0.7 — Foreca Edition" \
            --notes-file release-notes.md
      - name: Confirm public asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.7-official --repo "${GITHUB_REPOSITORY}" --json tagName,assets,url
