name: Publish Aurora Premium 1.3.18 — Approved LED Crescent & Cloud
on:
  push:
    branches: [main]
    paths: ['incoming/aurora1318/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora1318-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.18-Official-SIGNED.apk'
          DIR='incoming/aurora1318'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 150 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.18-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora1318-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora1318-package.txt
          grep -q "versionCode='150'" aurora1318-package.txt
          grep -q "versionName='1.3.18'" aurora1318-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora1318-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora1318-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 150, 1.3.18, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.18-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.18'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.18-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.18 — Night Crescent Geometry & Full Weather Icon Audit' \
            --notes 'Aurora Premium 1.3.18 (versionCode 150) — окончателно одобрена LED луна с облаче, визуално съпоставена с одобрения образец. Нощна частична облачност използва конкретните координати на 61 лунни LED точки и 51 облачни LED точки, еднакво рисувани в двата Digital слоя, без C-образна, листовидна или роговидна форма. Запазени са час, дата, температура от WUnderground/WeatherCloud, Smart Forecast 4.1, Foreca, Flip Clock, Pearl Ice White, Satin Light, 8 палитри, 9 анимирани дъждовни капки, 3 LED снежинки, OLED Smart Protection и празничните теми. Проверени са 210 дневни и нощни метеорологични комбинации, 240 цифрови комбинации и работещият Android пакет. Подписан с оригинален сертификат за OTA над 1.3.17 със запазени настройки.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
