name: Publish Aurora Premium 1.3.17 — Night Crescent Geometry & Full Weather Icon Audit
on:
  push:
    branches: [main]
    paths: ['incoming/aurora1317/ready.txt']
permissions:
  contents: write
concurrency:
  group: aurora1317-final-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct one immutable signed APK and verify source SHA-256
        shell: bash
        run: |
          set -euo pipefail
          NAME='Aurora-Premium-1.3.17-Official-SIGNED.apk'
          DIR='incoming/aurora1317'
          test -s "$DIR/sha256.txt"
          test -s "$DIR/bytes.txt"
          test -s "$DIR/source-commit.txt"
          test "$(find "$DIR" -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$DIR"/part-* | base64 --decode > "dist/$NAME"
          expected="$(cat "$DIR/sha256.txt")"
          echo "$expected  dist/$NAME" | sha256sum --check
          actualbytes="$(stat -c %s "dist/$NAME")"
          test "$actualbytes" -eq "$(cat "$DIR/bytes.txt")"
          test "$actualbytes" -ge 1800000
          test "$actualbytes" -le 8000000
          echo "SIGNED SOURCE SHA256= $expected"
      - name: Verify package, versionCode 149 and original production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.17-Official-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' > aurora1317-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora1317-package.txt
          grep -q "versionCode='149'" aurora1317-package.txt
          grep -q "versionName='1.3.17'" aurora1317-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora1317-cert.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora1317-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          echo 'Production-signed, package ID, 149, 1.3.17, and original certificate: VERIFIED'
      - name: Create exactly one official release, refuse overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.17-official'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite a previously published official 1.3.17'; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.17-Official-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.17 — Night Crescent Geometry & Full Weather Icon Audit' \
            --notes 'Aurora Premium 1.3.17 (versionCode 149) — поправка на луната с облак: използва се същият одобрен 25-редов LED сърп като при ясно нощно небе, намален и с правилно закриване на точките от облака. Премахната е деформираната луна с форма на листо/рог, както и старата C-образна резервна рисунка. Проведена е разширена проверка на 210 комбинации от метеорологични кодове и ден/нощ, визуална галерия с 28 варианта, 240 проверки на часа, всичките 10 цифри и седемте LED дни на седмицата. Запазени са всички 8 палитри, Pearl Ice White, Satin Light, 9 дъждовни LED капки, 3 анимирани снежинки, Flip Clock, Smart Forecast 4.1, Foreca, WU с резервен WeatherCloud, OLED Smart Protection и празничните теми. Подписан с оригиналния сертификат. OTA над 1.3.16 със запазени настройки.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
