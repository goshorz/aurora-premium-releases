name: Publish Aurora Premium 1.2.48 official signed APK
on:
  push:
    branches: [main]
    paths:
      - 'apk/Aurora-Premium-1.2.48-TightForecastSafe-SIGNED.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published binary
        uses: actions/checkout@v4
      - name: Verify source file and create public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=apk/Aurora-Premium-1.2.48-TightForecastSafe-SIGNED.apk
          TAG=v1.2.48-official
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite the signed public APK"
            exit 0
          fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aurora Premium 1.2.48 — Smart Forecast Safe Compact LED" \
            --notes "Официална подписана актуализация: разстоянието между датата и температурата е намалено с 6 px при Digital Premium. Часовникът, датата, температурата и другите стилове са запазени. Smart Forecast 2.0 използва отделен ред с пренасяне на дълги предупреждения. VersionCode 129. Обновява се върху текущата инсталация без деинсталиране."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,tagName,url
