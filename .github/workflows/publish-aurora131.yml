name: Publish Aurora Premium 1.3.1 official release (verified signed APK)
on:
  push:
    branches: [main]
    paths:
      - 'apk/Aurora-Premium-1.3.1-Unified-SIGNED.apk'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aurora-131-official
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified APK from public distribution repo
        uses: actions/checkout@v4
      - name: Verify SHA256, package, build and original certificate
        run: |
          set -euo pipefail
          APK='apk/Aurora-Premium-1.3.1-Unified-SIGNED.apk'
          test -s "$APK"
          echo 'b2ea383446acdefc73b89c635f2a9a60789f9dceab6df4477e1018175cccac11  apk/Aurora-Premium-1.3.1-Unified-SIGNED.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee aurora-131-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora-131-package.txt
          grep -q "versionCode='133'" aurora-131-package.txt
          grep -q "versionName='1.3.1'" aurora-131-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora-131-signing.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora-131-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Publish exactly one official APK (do not overwrite existing releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.3.1-official'
          APK='apk/Aurora-Premium-1.3.1-Unified-SIGNED.apk'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing public Aurora Premium 1.3.1 release'
            exit 1
          fi
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.1 — Smart Forecast 3.0+ и 6 Digital LED цвята' \
            --notes 'Aurora Premium 1.3.1 е обща подписана актуализация с три нови цвята за Digital Premium (Pure White, Pearl Ice White, Aurora Cyan) и Smart Forecast 3.0+ с предупреждения за значим и интензивен прогнозен дъжд, сняг, студ, вятър, гръмотевици, мъгла и жега. Без излишно съобщение за дъжд, който вече се вижда на иконата. Запазва OLED Smart Protection, Weather Icons Ultra, Flip Ultra Realism, Satin Light, Crystal Depth, настройките и Pixel Shift. VersionCode 133; оригинален подпис за обновяване на 1.3.0.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,tagName
