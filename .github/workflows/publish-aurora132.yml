name: Publish Aurora Premium 1.3.2 official signed APK
on:
  push:
    branches: [main]
    paths:
      - 'incoming/aurora132/ready.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aurora-132-official
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and SHA-verify original signed APK
        run: |
          set -euo pipefail
          SRC=incoming/aurora132
          test -f "$SRC/ready.txt"
          test -f "$SRC/checksum.txt"
          test "$(find "$SRC" -maxdepth 1 -name 'part-*' | wc -l)" -ge 20
          mkdir -p dist
          cat "$SRC"/part-* | base64 --decode > dist/Aurora-Premium-1.3.2-Unified-SIGNED.apk
          echo '77918d6d1047a1d80f61e7c9fa63c4e9ddd2d40f1088d9a0656241a4c142c59d  dist/Aurora-Premium-1.3.2-Unified-SIGNED.apk' | sha256sum -c -
          test "$(stat -c %s dist/Aurora-Premium-1.3.2-Unified-SIGNED.apk)" = 2275266
      - name: Verify Android package, original certificate and zip alignment
        run: |
          set -euo pipefail
          APK='dist/Aurora-Premium-1.3.2-Unified-SIGNED.apk'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee aurora132-package.txt
          grep -q "name='bg.razgrad.aurorapremium'" aurora132-package.txt
          grep -q "versionCode='134'" aurora132-package.txt
          grep -q "versionName='1.3.2'" aurora132-package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > aurora132-certificate.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' aurora132-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - name: Publish verified Aurora Premium 1.3.2 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.3.2-official
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing $TAG"; exit 1
          fi
          gh release create "$TAG" dist/Aurora-Premium-1.3.2-Unified-SIGNED.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Aurora Premium 1.3.2 — Digital LED Premium & Smart Forecast Diagnostics Plus' \
            --notes 'Официална версия 1.3.2 (versionCode 134). Датата в Digital Premium е без водещи нули; LED Glow Soft/Balanced/Premium, плавна смяна на цифровата метеорологична икона, Smart Forecast Diagnostics Plus и ненатрапчив ефект на датата при полунощ. Запазени Pearl Ice White, Satin Light, OLED Smart Protection, Pixel Shift, прогнозните предупреждения, стиловете и настройките. Подписана с оригиналния сертификат за обновяване на Aurora Premium 1.3.1.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,tagName
